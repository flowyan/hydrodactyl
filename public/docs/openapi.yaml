      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        metrics:
          type: object
          properties:
            uptime:
              description: 'Value returned by the API.'
            memory:
              description: 'Value returned by the API.'
            cpu:
              description: 'Value returned by the API.'
            cpu_cores:
              description: 'Value returned by the API.'
            disk:
              description: 'Value returned by the API.'
          required:
            - uptime
            - memory
            - cpu
            - cpu_cores
            - disk
        system:
          type: object
          properties:
            php_version:
              description: 'Value returned by the API.'
            os:
              description: 'Value returned by the API.'
            hostname:
              description: 'Value returned by the API.'
            load_average:
              description: 'Value returned by the API.'
