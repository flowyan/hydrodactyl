                  type: string
                  description: 'Must match the regex /^([\/][\d\w.\-\/]+)$/.'
                  example: //.d
                daemon_sftp:
                  type: number
                  description: 'Must be between 1 and 65535.'
                  example: 2
                daemon_listen:
                  type: number
                  description: 'Must be between 1 and 65535.'
                  example: 2
                maintenance_mode:
                  type: boolean
                  description: ''
                  example: true
                upload_size:
                  type: integer
                  description: 'Must be between 1 and 1024.'
                  example: 2
                daemon_type:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                backup_disk:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                bucket:
                  type: number
                  description: 'Must match an existing stored value.'
                  example: 4326.41688
                  nullable: true
              required:
                - name
                - location_id
                - fqdn
                - scheme
                - memory
                - memory_overallocate
                - disk
                - disk_overallocate
                - daemon_sftp
                - daemon_listen
