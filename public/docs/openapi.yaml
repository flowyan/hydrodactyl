openapi: 3.0.3
info:
  title: 'Hydrodactyl API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: /
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
  schemas:
    ApiErrorItem:
      type: object
      required:
        - code
        - status
        - detail
      properties:
        code:
          type: string
        status:
          type: string
        detail:
          type: string
        meta:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorItem'
    AuthenticationError:
      $ref: '#/components/schemas/ApiError'
    ValidationErrorItem:
      allOf:
        -
          $ref: '#/components/schemas/ApiErrorItem'
        -
          type: object
          required:
            - meta
          properties:
            meta:
              type: object
              required:
                - source_field
                - rule
              properties:
                source_field:
                  type: string
                rule:
                  type: string
    ValidationError:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
    PaginationMeta:
      type: object
      properties:
        pagination:
          type: object
          properties:
            total:
              type: integer
            count:
              type: integer
            per_page:
              type: integer
            current_page:
              type: integer
            total_pages:
              type: integer
            links:
              type: object
              properties:
                previous:
                  type: string
                next:
                  type: string
