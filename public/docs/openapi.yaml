security:
  -
    default: []
paths:
  /api/application/panel/status:
    get:
      summary: 'Get system metrics and status'
      operationId: getSystemMetricsAndStatus
      description: ''
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PterodactylHttpControllersBaseSystemStatusControllerIndexResponse'
        401:
          description: 'Authentication required'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        404:
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Endpoints
  /api/application/users:
    get:
      summary: 'List all users'
      operationId: listAllUsers
      description: ''
      parameters:
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: 'filter[email]'
          in: query
          required: false
          schema:
            type: string
        -
          name: 'filter[uuid]'
          in: query
          required: false
          schema:
            type: string
        -
          name: 'filter[username]'
          in: query
          required: false
          schema:
            type: string
        -
          name: 'filter[external_id]'
          in: query
          required: false
          schema:
            type: string
        -
          name: sort
          in: query
          required: false
          schema:
            type: string
            description: 'Comma-separated sort fields (prefix - for descending): id, uuid'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationUserTransformerList'
        401:
          description: 'Authentication required'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        404:
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Endpoints
    post:
      summary: 'Create a new user'
      operationId: createANewUser
      description: ''
      parameters: []
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationUserTransformerResource'
        401:
          description: 'Authentication required'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        404:
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        429:
          description: 'Too many requests'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        400:
          description: 'Bad request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must be between 1 and 191 characters.'
                  example: gbailey@example.net
                external_id:
                  type: string
                  description: 'Must not be greater than 191 characters.'
                  example: m
                  nullable: true
                username:
                  type: string
                  description: 'Must be between 1 and 191 characters.'
                  example: iy
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                  nullable: true
                root_admin:
                  type: boolean
                  description: ''
                  example: true
                language:
                  type: string
                  description: ''
                  example: en
                  enum:
                    - en
                first_name:
                  type: string
                  description: 'Must be between 1 and 191 characters.'
                  example: vd
                last_name:
                  type: string
                  description: 'Must be between 0 and 191 characters.'
                  example: l
                  nullable: true
              required:
                - email
                - username
                - first_name
